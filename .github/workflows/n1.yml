# Combined Cursor execution environment on GitHub-hosted runners.
# Dispatch-only (never on push/PR) so it does not widen product CI billing.
#
# Replaces a Cursor Cloud VM: you pay GHA minutes, not Cursor VM credits.
# Harbours the tinf + basic-test union:
#   tinf n1.yml          — build any ref, Tailscale MCP, private-plane catalog
#   basic-test RDP       — XFCE + xrdp on the tailnet
#   Cursor My Machines   — `agent worker --computer-use --share-desktop`
#                           so cursor.com/agents runs ON this runner
#
# Secrets (names only — never commit values):
#   CURSOR_API_KEY       — personal user API key (My Machines worker)
#   MCP_BEARER_TOKEN     — daemon + Desktop remote MCP
#   TAILSCALE_AUTH_KEY   — optional; omit to use n1-style manual login
#   RDP_PASSWORD         — optional; generated for the job if unset
#   SOURCE_FETCH_TOKEN   — checkout token for the source owner/name
#   DEFAULT_SOURCE_REPO  — optional owner/name when source_repo input is empty
name: cursor-env

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref of the source repo to build (any version)"
        type: string
        required: false
        default: "main"
      source_repo:
        description: "owner/name to checkout (empty = DEFAULT_SOURCE_REPO secret)"
        type: string
        required: false
        default: ""
      hold_minutes:
        description: "Hold window (minutes), 1..360"
        type: number
        required: false
        default: 360
      port:
        description: "MCP listen port on the Tailscale IP"
        type: number
        required: false
        default: 8741
      bootstrap_bpftime:
        description: "Also bootstrap live bpftime (slow)"
        type: boolean
        required: false
        default: false

concurrency:
  group: cursor-env-session
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  session:
    name: Build + MCP + RDP + Cursor worker
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      MCP_BEARER_TOKEN: ${{ secrets.MCP_BEARER_TOKEN }}
      TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
      SOURCE_FETCH_TOKEN: ${{ secrets.SOURCE_FETCH_TOKEN }}
      DEFAULT_SOURCE_REPO: ${{ secrets.DEFAULT_SOURCE_REPO }}
      SYMBOTREE_BPFTIME_HOME: /home/runner/.bpftime

    steps:
      - name: Resolve inputs
        id: resolve
        shell: bash
        env:
          INPUT_REPO: ${{ inputs.source_repo }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_HOLD: ${{ inputs.hold_minutes }}
          INPUT_PORT: ${{ inputs.port }}
          SECRET_DEFAULT_SOURCE_REPO: ${{ secrets.DEFAULT_SOURCE_REPO }}
        run: |
          set -euo pipefail
          REPO="$(echo "${INPUT_REPO:-}" | xargs)"
          if [[ -z "${REPO}" ]]; then
            REPO="$(echo "${SECRET_DEFAULT_SOURCE_REPO:-}" | xargs)"
          fi
          if [[ -z "${REPO}" ]]; then
            echo "::error::Source repo unresolved. Pass source_repo (owner/name) or set Actions secret DEFAULT_SOURCE_REPO."
            exit 1
          fi
          if ! [[ "${REPO}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::source_repo must look like owner/name"
            exit 1
          fi
          REF="$(echo "${INPUT_REF:-main}" | xargs)"
          [[ -n "${REF}" ]] || REF="main"
          HOLD="${INPUT_HOLD:-360}"
          if ! [[ "${HOLD}" =~ ^[0-9]+$ ]]; then
            echo "::error::hold_minutes must be an integer"
            exit 1
          fi
          if [[ "${HOLD}" -lt 1 ]]; then HOLD=1; fi
          if [[ "${HOLD}" -gt 360 ]]; then HOLD=360; fi
          PORT="${INPUT_PORT:-8741}"
          if ! [[ "${PORT}" =~ ^[0-9]+$ ]] || [[ "${PORT}" -lt 1 ]] || [[ "${PORT}" -gt 65535 ]]; then
            echo "::error::port must be 1..65535"
            exit 1
          fi
          {
            echo "source_repo=${REPO}"
            echo "ref=${REF}"
            echo "hold_minutes=${HOLD}"
            echo "port=${PORT}"
            echo "same_repo=0"
          } >> "${GITHUB_OUTPUT}"
          echo "Resolved source=${REPO}@${REF} hold=${HOLD}m port=${PORT}"

      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.resolve.outputs.source_repo }}
          ref: ${{ steps.resolve.outputs.ref }}
          token: ${{ secrets.SOURCE_FETCH_TOKEN }}
          submodules: recursive
          fetch-depth: 1

      - name: Fail fast on required secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          if [[ -z "${CURSOR_API_KEY}" ]]; then
            echo "::error::Secret CURSOR_API_KEY is required (Cursor Dashboard → API Keys, personal user key)"
            missing=1
          fi
          if [[ -z "${MCP_BEARER_TOKEN}" ]]; then
            echo "::error::Secret MCP_BEARER_TOKEN is required (daemon + Desktop remote MCP)"
            missing=1
          fi
          if [[ -z "${SOURCE_FETCH_TOKEN}" ]]; then
            echo "::error::Secret SOURCE_FETCH_TOKEN is required (checkout/fetch token for the source repo)"
            missing=1
          fi
          if [[ "${missing}" -ne 0 ]]; then
            exit 1
          fi

      - name: Desktop packages (basic-test RDP + Cursor Linux computer-use)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            xfce4 xfce4-goodies xrdp dbus-x11 ufw net-tools curl wget unzip \
            ffmpeg tigervnc-standalone-server x11-utils x11-xserver-utils xdotool
          echo "xfce4-session" | sudo tee /etc/skel/.xsession
          sudo adduser xrdp ssl-cert 2>/dev/null || true
          sudo sed -i 's/^KillDisconnected=.*/KillDisconnected=false/' /etc/xrdp/sesman.ini \
            || echo "KillDisconnected=false" | sudo tee -a /etc/xrdp/sesman.ini
          sudo sed -i 's/^DisconnectedTimeLimit=.*/DisconnectedTimeLimit=0/' /etc/xrdp/sesman.ini \
            || echo "DisconnectedTimeLimit=0" | sudo tee -a /etc/xrdp/sesman.ini
          sudo sed -i 's/^IdleTimeLimit=.*/IdleTimeLimit=0/' /etc/xrdp/sesman.ini \
            || echo "IdleTimeLimit=0" | sudo tee -a /etc/xrdp/sesman.ini
          sudo systemctl enable xrdp
          sudo systemctl restart xrdp

      - name: Create RDP user
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RDP_PASSWORD}" ]]; then
            RDP_PASSWORD="$(openssl rand -base64 18 | tr -d '/+=' | head -c 20)"
            echo "RDP_PASSWORD_GENERATED=1" >> "${GITHUB_ENV}"
          else
            echo "RDP_PASSWORD_GENERATED=0" >> "${GITHUB_ENV}"
          fi
          if ! id rdp >/dev/null 2>&1; then
            sudo useradd -m -s /bin/bash rdp
          fi
          echo "rdp:${RDP_PASSWORD}" | sudo chpasswd
          sudo usermod -aG sudo rdp
          echo "xfce4-session" | sudo tee /home/rdp/.xsession
          sudo chown rdp:rdp /home/rdp/.xsession
          sudo install -d -o rdp -g rdp /home/rdp/.config/autostart
          printf '%s\n' \
            '[Desktop Entry]' \
            'Type=Application' \
            'Name=DisableLockScreen' \
            'Exec=xfconf-query -c xfce4-screensaver -p /saver/enabled -s false' \
            'X-GNOME-Autostart-enabled=true' \
            | sudo tee /home/rdp/.config/autostart/disable-lock.desktop >/dev/null
          sudo chown -R rdp:rdp /home/rdp/.config
          {
            echo "RDP_USER=rdp"
            echo "RDP_PASSWORD=${RDP_PASSWORD}"
          } >> "${GITHUB_ENV}"

      - name: Build this ref (tinf compile path)
        shell: bash
        env:
          SYMBOTREE_BOOTSTRAP_BPFTIME: ${{ inputs.bootstrap_bpftime && '1' || '0' }}
        run: |
          set -euo pipefail
          if [[ -x scripts/cursor_cloud_install.sh ]]; then
            bash scripts/cursor_cloud_install.sh
          else
            bash scripts/ensure_symbotreed.sh
          fi
          test -x .symbotree/bin/symbotreed || test -x target/release/symbotreed

      - name: Install Cursor CLI
        shell: bash
        run: |
          set -euo pipefail
          curl https://cursor.com/install -fsS | bash
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          echo "${HOME}/.cursor/bin" >> "${GITHUB_PATH}"
          export PATH="${HOME}/.local/bin:${HOME}/.cursor/bin:${PATH}"
          agent --version || cursor-agent --version

      - name: Install Tailscale
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://tailscale.com/install.sh | sudo sh
          sudo mkdir -p /var/run/tailscale /var/lib/tailscale /dev/net
          if [[ ! -c /dev/net/tun ]]; then
            sudo mknod /dev/net/tun c 10 200
            sudo chmod 666 /dev/net/tun
          fi
          if [[ ! -c /dev/net/tun ]]; then
            echo "::error::/dev/net/tun unavailable; cannot publish inbound Tailscale listeners"
            exit 1
          fi
          sudo tailscaled \
            --state=/var/lib/tailscale/tailscaled.state \
            --socket=/var/run/tailscale/tailscaled.sock \
            >/tmp/tailscaled.log 2>&1 &
          for i in $(seq 1 30); do
            if sudo tailscale --socket=/var/run/tailscale/tailscaled.sock status >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

      - name: Tailscale up
        shell: bash
        run: |
          set -euo pipefail
          HOSTNAME="gha-cursor-env-${GITHUB_RUN_ID}"
          SOCK=(--socket=/var/run/tailscale/tailscaled.sock)
          if [[ -n "${TAILSCALE_AUTH_KEY}" ]]; then
            sudo tailscale "${SOCK[@]}" up \
              --authkey="${TAILSCALE_AUTH_KEY}" \
              --hostname="${HOSTNAME}" \
              --accept-dns=false
          else
            echo "================================================================"
            echo "No TAILSCALE_AUTH_KEY. Open the auth URL below and approve."
            echo "================================================================"
            sudo tailscale "${SOCK[@]}" up \
              --hostname="${HOSTNAME}" \
              --accept-dns=false \
              --ssh \
              --timeout=0
          fi
          TS_IP="$(sudo tailscale "${SOCK[@]}" ip -4 | head -n1)"
          if [[ -z "${TS_IP}" ]]; then
            echo "::error::Tailscale IPv4 missing"
            exit 1
          fi
          echo "TS_IP=${TS_IP}" >> "${GITHUB_ENV}"
          echo "Tailscale IPv4=${TS_IP}"

      - name: Firewall (Tailscale only)
        env:
          PORT: ${{ steps.resolve.outputs.port }}
        shell: bash
        run: |
          set -euo pipefail
          sudo ufw default deny incoming
          sudo ufw allow in on tailscale0 to any port 3389 proto tcp
          sudo ufw allow in on tailscale0 to any port "${PORT}" proto tcp
          sudo ufw --force enable
          nc -zv -w 5 "${TS_IP}" 3389 || echo "::warning::RDP 3389 not reachable yet (session starts on first connect)"

      - name: Start symbotreed (UDS + Tailscale TCP)
        id: mcp
        env:
          PORT: ${{ steps.resolve.outputs.port }}
        shell: bash
        run: |
          set -euo pipefail
          DAEMON=""
          for c in .symbotree/bin/symbotreed target/release/symbotreed; do
            if [[ -x "${c}" ]]; then DAEMON="$(pwd)/${c}"; break; fi
          done
          if [[ -z "${DAEMON}" ]]; then
            echo "::error::symbotreed binary missing"
            exit 1
          fi
          ARTIFACT_DIR="${RUNNER_TEMP}/cursor-env"
          mkdir -p "${ARTIFACT_DIR}" .symbotree
          TOKEN_FILE="${ARTIFACT_DIR}/mcp.bearer"
          umask 077
          printf '%s' "${MCP_BEARER_TOKEN}" > "${TOKEN_FILE}"
          chmod 0600 "${TOKEN_FILE}"
          WS_SESSION="gha-${GITHUB_RUN_ID}"
          echo "SYMBOTREE_WORKSPACE_SESSION=${WS_SESSION}" >> "${GITHUB_ENV}"
          LISTEN="${TS_IP}:${PORT}"
          LOG="${ARTIFACT_DIR}/daemon.log"
          env \
            "SYMBOTREE_FS_IDENTITY=local" \
            "SYMBOTREE_WORKSPACE_SESSION=${WS_SESSION}" \
            "SYMBOTREE_AGENT_WORKSPACE=$(pwd)" \
            "${DAEMON}" \
            --socket "$(pwd)/.symbotree/mcp.sock" \
            --listen "${LISTEN}" \
            --token-file "${TOKEN_FILE}" \
            --allow-tools all \
            >"${LOG}" 2>&1 &
          echo $! > "${ARTIFACT_DIR}/daemon.pid"
          BASE_URL="http://${LISTEN}"
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS --max-time 2 "${BASE_URL}/health" >/dev/null; then
              ok=1
              break
            fi
            sleep 1
          done
          if [[ "${ok}" -ne 1 ]]; then
            echo "::error::/health never ready"
            tail -n 200 "${LOG}" || true
            exit 1
          fi
          echo "MCP_BASE_URL=${BASE_URL}" >> "${GITHUB_ENV}"
          echo "DAEMON_PID_FILE=${ARTIFACT_DIR}/daemon.pid" >> "${GITHUB_ENV}"
          echo "DAEMON_LOG=${LOG}" >> "${GITHUB_ENV}"
          echo "base_url=${BASE_URL}" >> "${GITHUB_OUTPUT}"
          echo "health ok ${BASE_URL}"

      - name: Start Cursor worker (My Machines — no Cursor VM)
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.local/bin:${HOME}/.cursor/bin:${PATH}"
          export CURSOR_API_KEY
          nohup agent worker \
            --computer-use \
            --share-desktop \
            --name gha-cursor-env \
            --worker-dir "$(pwd)" \
            --api-key "${CURSOR_API_KEY}" \
            start \
            >/tmp/cursor-worker.log 2>&1 &
          echo $! > /tmp/cursor-worker.pid
          sleep 8
          if ! kill -0 "$(cat /tmp/cursor-worker.pid)" 2>/dev/null; then
            echo "::error::Cursor worker exited; log:"
            tail -n 200 /tmp/cursor-worker.log || true
            exit 1
          fi
          echo "WORKER_PID_FILE=/tmp/cursor-worker.pid" >> "${GITHUB_ENV}"
          echo "Cursor worker started as name=gha-cursor-env"

      - name: Publish how to connect
        env:
          HOLD: ${{ steps.resolve.outputs.hold_minutes }}
          REF: ${{ steps.resolve.outputs.ref }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## cursor-env session ready"
            echo ""
            echo "This is a GitHub-hosted runner, **not** a Cursor Cloud VM."
            echo ""
            echo "| Thing | Value |"
            echo "| --- | --- |"
            echo "| ref | \`${REF}\` |"
            echo "| Tailscale IPv4 | \`${TS_IP}\` |"
            echo "| MCP | \`${MCP_BASE_URL}\` |"
            echo "| session | \`${SYMBOTREE_WORKSPACE_SESSION}\` |"
            echo "| RDP | \`${TS_IP}:3389\` user \`rdp\` |"
            echo "| Cursor worker name | \`gha-cursor-env\` |"
            echo "| hold | ${HOLD} minutes |"
            echo ""
            echo "### Cursor web (no VM credits)"
            echo "1. Open https://cursor.com/agents"
            echo "2. Pick machine **gha-cursor-env** (My Machines / self-hosted)"
            echo "3. Send a task. Use **Take control** / desktop share on that worker."
            echo "4. Slack/GitHub: \`worker=gha-cursor-env\`"
            echo ""
            echo "### Laptop Cursor MCP (stdio bridge, not bare HTTP)"
            echo '```'
            echo "export SYMBOTREE_PRIVATE_PLANE_URL=${MCP_BASE_URL}"
            echo "export SYMBOTREE_RPC_TOKEN=<MCP_BEARER_TOKEN>"
            echo "export SYMBOTREE_WORKSPACE_SESSION=${SYMBOTREE_WORKSPACE_SESSION}"
            echo "# .cursor/mcp.json → symbotree-private-plane"
            echo '```'
            echo ""
            echo "### RDP (basic-test path, Tailscale only)"
            echo "Address \`${TS_IP}\` port 3389 user \`rdp\`."
            if [[ "${RDP_PASSWORD_GENERATED}" == "1" ]]; then
              echo "Ephemeral password for this job only: \`${RDP_PASSWORD}\`"
            else
              echo "Password is the \`RDP_PASSWORD\` Actions secret."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Hold until cancelled or timeout
        env:
          HOLD: ${{ steps.resolve.outputs.hold_minutes }}
        shell: bash
        run: |
          set -euo pipefail
          END_AT=$((SECONDS + HOLD * 60))
          echo "Holding until ${END_AT} (hold_minutes=${HOLD})"
          while (( SECONDS < END_AT )); do
            if [[ -n "${DAEMON_PID_FILE:-}" ]] && ! kill -0 "$(cat "${DAEMON_PID_FILE}")" 2>/dev/null; then
              echo "::error::daemon died"
              tail -n 200 "${DAEMON_LOG:-/dev/null}" || true
              exit 1
            fi
            if [[ -n "${WORKER_PID_FILE:-}" ]] && ! kill -0 "$(cat "${WORKER_PID_FILE}")" 2>/dev/null; then
              echo "::error::Cursor worker died"
              tail -n 200 /tmp/cursor-worker.log || true
              exit 1
            fi
            if [[ -n "${MCP_BASE_URL:-}" ]]; then
              curl -fsS --max-time 5 "${MCP_BASE_URL}/health" >/dev/null \
                || echo "::warning::periodic /health failed"
            fi
            remaining=$(( END_AT - SECONDS ))
            echo "[$(date -u +%H:%M:%SZ)] health ok; ~${remaining}s remaining"
            sleep 30
          done
          echo "Hold complete"